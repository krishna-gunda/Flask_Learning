<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome Page</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            width: 400px;

            text-align: center;

            border-radius: 15px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #222;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 18px;
        }

        .name {
            color: #007bff;
            font-weight: bold;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;

            border: none;
            border-radius: 8px;

            background: #007bff;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Welcome, <span class="name">{{ name }}</span>!</h1>

        <p>
            Welcome to my Flask application.
        </p>

        <button>Get Started</button>

    </div>

</body>

</html>
